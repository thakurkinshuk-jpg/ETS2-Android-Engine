
name: Build ETS2 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Android APK
        run: dotnet publish src/ETS2AndroidEngine/ETS2AndroidEngine.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETS2-Android-APK
          path: src/ETS2AndroidEngine/bin/Release/net10.0-android/*.apk
          if-no-files-found: error
